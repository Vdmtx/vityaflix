<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050b14">
  <title>ВитяФликс — Vityaflix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand small">
      <div class="brand-main">Витя<span>Фликс</span></div>
      <div class="brand-sub">Vityaflix</div>
    </div>
    <nav>
      <button class="nav-item active" data-action="home"><span>⌂</span>Início</button>
      <button class="nav-item" data-action="movies"><span>▣</span>Filmes</button>
      <button class="nav-item" data-action="categories"><span>▤</span>Categorias</button>
      <button class="nav-item" data-action="favorites"><span>♡</span>Minha lista</button>
      <button class="nav-item" data-action="explore"><span>◉</span>Explorar</button>
    </nav>
    <div class="drive-box">
      <strong>Biblioteca pessoal</strong>
      <span>Google Drive</span>
      <small>Escopo: pasta “filmes”</small>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div class="brand mobile">
        <div class="brand-main">Витя<span>Фликс</span></div>
        <div class="brand-sub">Vityaflix</div>
      </div>
      <div class="search-wrap">
        <span>⌕</span>
        <input id="search" type="search" placeholder="Buscar filmes...">
      </div>
      <div class="top-icons"><button aria-label="Notificações">♢</button><div class="avatar">V</div></div>
    </header>

    <section class="hero">
      <div class="hero-art" aria-hidden="true">
        <div class="moon"></div>
        <div class="mountains m1"></div>
        <div class="mountains m2"></div>
        <div class="city"></div>
        <div class="water"></div>
      </div>
      <div class="brand hero-brand">
        <div class="brand-main">Витя<span>Фликс</span></div>
        <div class="brand-sub">Vityaflix</div>
      </div>
      <div class="hero-content">
        <div class="eyebrow">DESTAQUE</div>
        <h1 id="heroTitle">Transcendence: A Revolução</h1>
        <p id="heroText">Tecnologia, consciência e os limites entre o homem e a máquina.</p>
        <div class="hero-meta"><span id="heroYear">2014</span><span>720p preferencial</span><span id="heroCat">Ficção científica</span></div>
        <div class="hero-actions">
          <button class="primary" id="playFeatured">▶ Assistir agora</button>
          <button class="secondary" id="moreInfo">Mais informações</button>
        </div>
      </div>
    </section>

    <section id="catalog" class="catalog"></section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
